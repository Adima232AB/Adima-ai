<section id="adima-card-section" class="adima-section">
  <div class="adima-container">
    <div class="adima-card" role="region" aria-labelledby="adima-heading">
      <div class="card-header">
        <div class="adima-logo-wrap">
          <!-- Replace this SVG with your official Adima logo if available -->
          <svg class="adima-logo" width="44" height="44" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <circle cx="32" cy="32" r="30" fill="none" stroke="var(--adima-green)" stroke-width="4"/>
            <path d="M18 38c6-10 16-18 28-12" stroke="var(--adima-green)" stroke-width="4" stroke-linecap="round" fill="none"/>
          </svg>
          <h3 id="adima-heading">Adima</h3>
        </div>
        <a class="history-link" href="/history" aria-label="View history">History</a>
      </div>

      <div class="adima-body">
        <label for="adima-input" class="sr-only">Ask Adima</label>
        <div class="input-row">
          <button class="btn attach-btn" id="attach-btn" aria-label="Attach file" title="Attach">
            <!-- attach icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21.44 11.05l-9.19 9.19a6.5 6.5 0 01-9.19-9.19l9.19-9.19a4.5 4.5 0 016.36 6.36L9.9 17.1a2.5 2.5 0 11-3.54-3.54L17 3.42" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <input id="adima-input" class="adima-input" type="search" placeholder="Ask anything" autocomplete="off" />

          <button class="btn send-btn" id="send-btn" aria-label="Send question" title="Send">
            <!-- up arrow icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5l7 7-1.4 1.4L13 9.8V20h-2V9.8L6.4 13.4 5 12z" fill="#fff"/>
            </svg>
          </button>

          <!-- hidden file input for attach -->
          <input id="file-input" type="file" multiple style="display:none" />
        </div>

        <div class="quick-actions" role="toolbar" aria-label="Quick actions">
          <button class="qa-btn" data-action="search" title="Search" aria-label="Search">
            <!-- globe icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 2v2m0 12v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <span>Search</span>
          </button>

          <button class="qa-btn" data-action="create-image" title="Create an image" aria-label="Create an image">
            <!-- pencil icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l3-1 11-11 1-3-3 1-11 11-1 3z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Create an image</span>
          </button>

          <button class="qa-btn" data-action="analyze-image" title="Analyze an image" aria-label="Analyze an image">
            <!-- image icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/><path d="M21 15l-5-5-7 7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Analyze an image</span>
          </button>

          <button class="qa-btn" data-action="summarize" title="Summarize text" aria-label="Summarize text">
            <!-- text icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h8M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <span>Summarize text</span>
          </button>

          <button class="more-btn" title="More options" aria-label="More options">→</button>
        </div>

        <div class="card-footer">
          <small class="muted">Ask Adima about today's news</small>
          <a class="adima-link" href="https://AdimaAI.com" target="_blank" rel="noopener">AdimaAI.com</a>
        </div>
      </div>
    </div>
  </div>
</section>
